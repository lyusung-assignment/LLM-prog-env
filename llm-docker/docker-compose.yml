services:
  llm:
    build:
      context: .
      dockerfile: Dockerfile
    image: llm-lab:cu126
    container_name: llm-lab

    # --- GPU allocation (requires Docker Desktop + NVIDIA Container Toolkit) ---
    gpus: all
    # If the one-liner above does not work, replace it with the deploy block below.
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

    ports:
      - "8888:8888"    # JupyterLab
      - "6006:6006"    # TensorBoard (optional)

    volumes:
      - ./workspace:/workspace          # Code/notebooks (shared with the host)
      - hf-cache:/workspace/.cache      # Model weight cache (survives rebuilds)
      - conda-envs:/envs                # Per-lab conda envs (survive `compose down`)
      - jupyter-kernels:/root/.local/share/jupyter/kernels   # Per-lab Jupyter kernels

    environment:
      - JUPYTER_TOKEN=${JUPYTER_TOKEN:-llm}
      - HF_TOKEN=${HF_TOKEN:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility

    # Prevents silent crashes from /dev/shm exhaustion when loading large models
    shm_size: "16gb"
    ipc: host

    stdin_open: true
    tty: true
    restart: unless-stopped

volumes:
  hf-cache:
  conda-envs:
  jupyter-kernels:
