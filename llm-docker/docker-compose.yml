services:
  llm:
    build:
      context: .
      dockerfile: Dockerfile
    image: llm-lab:cu126
    container_name: llm-lab

    # --- GPU 할당 (Docker Desktop + NVIDIA Container Toolkit 필요) ---
    gpus: all
    # 위 한 줄이 안 먹으면 아래 deploy 블록으로 대체하세요.
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

    ports:
      - "8888:8888"    # JupyterLab
      - "6006:6006"    # TensorBoard (선택)

    volumes:
      - ./workspace:/workspace          # 코드/노트북 (호스트와 공유)
      - hf-cache:/workspace/.cache      # 모델 가중치 캐시 (재빌드해도 유지)

    environment:
      - JUPYTER_TOKEN=${JUPYTER_TOKEN:-llm}
      - HF_TOKEN=${HF_TOKEN:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility

    # Large Model 로딩 시 /dev/shm 부족으로 죽는 것 방지
    shm_size: "16gb"
    ipc: host

    stdin_open: true
    tty: true
    restart: unless-stopped

volumes:
  hf-cache:
